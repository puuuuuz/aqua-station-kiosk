<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aqua Station Kiosk Loader</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: radial-gradient(circle at center, #0e172f 0%, #060913 100%);
            color: #ffffff;
            font-family: 'Outfit', 'Sarabun', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        .loader-container {
            text-align: center;
            width: 100%;
            max-width: 450px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        /* Pulsing Glow Logo */
        .logo-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
        }
        .glowing-circle {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #00f2fe;
            border-bottom-color: #4facfe;
            animation: spin 2s linear infinite;
        }
        .glowing-circle-outer {
            position: absolute;
            width: 120%;
            height: 120%;
            border-radius: 50%;
            border: 2px dashed rgba(0, 242, 254, 0.2);
            animation: spin-reverse 8s linear infinite;
        }
        .logo-text {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 4px;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            z-index: 2;
        }

        /* Title */
        .system-title {
            font-size: 22px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 1px;
        }
        .system-subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 5px;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Progress Area */
        .progress-area {
            width: 100%;
            margin-top: 15px;
        }
        .progress-track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.8);
            border-radius: 10px;
            transition: width 0.4s cubic-bezier(0.1, 0.8, 0.3, 1);
        }

        /* Status text */
        .status-text {
            font-size: 15px;
            color: #00f2fe;
            margin-top: 15px;
            height: 22px;
            font-weight: 400;
            text-shadow: 0 0 8px rgba(0, 242, 254, 0.3);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes spin-reverse {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }
    </style>
</head>
<body>

    <div class="loader-container">
        <div class="logo-wrapper">
            <div class="glowing-circle-outer"></div>
            <div class="glowing-circle"></div>
            <div class="logo-text">AQUA</div>
        </div>

        <div>
            <div class="system-title">AQUA STATION</div>
            <div class="system-subtitle">Hybrid Intelligent Bootloader</div>
        </div>

        <div class="progress-area">
            <div class="progress-track">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <div id="status-text" class="status-text">⚡ กำลังตรวจสอบความพร้อมของระบบ...</div>
        </div>
    </div>

    <script>
        const REMOTE_URL = "https://shimmering-orion.vercel.app/station-v121.html";
        const LOCAL_FALLBACK = "station-v121.html";
        const progressBar = document.getElementById('progress-bar');
        const statusText = document.getElementById('status-text');

        // Log utility to Native if available
        function nativeLog(msg) {
            console.log("[BOOTLOADER] " + msg);
            if (window.AndroidSerial && typeof window.AndroidSerial.jsLog === 'function') {
                window.AndroidSerial.jsLog("🛸 [BOOTLOADER] " + msg);
            }
        }

        async function checkConnectionAndBoot() {
            nativeLog("Starting connection check...");
            progressBar.style.width = "25%";

            // Fast network check utilizing Fetch API with timeout
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 3500); // 3.5 seconds check limit

            try {
                statusText.innerText = "🌐 กำลังเชื่อมต่อคลาวด์เซิร์ฟเวอร์...";
                progressBar.style.width = "50%";

                // Fetch Vercel with HEAD method to minimize bandwidth
                const response = await fetch(REMOTE_URL, {
                    method: "HEAD",
                    mode: "no-cors",
                    cache: "no-cache",
                    signal: controller.signal
                });

                clearTimeout(timeoutId);
                nativeLog("🟢 Cloud Server is Online. Syncing assets...");
                statusText.innerText = "🟢 ออนไลน์: กำลังดึงข้อมูลล่าสุดจากเซิร์ฟเวอร์...";
                statusText.style.color = "#00f2fe";
                progressBar.style.width = "100%";

                // Smooth redirect to online web app
                setTimeout(() => {
                    window.location.href = REMOTE_URL + "?t=" + Date.now();
                }, 500);

            } catch (error) {
                clearTimeout(timeoutId);
                nativeLog("⚠️ Offline or server unreachable. Launching offline mode.");
                statusText.innerText = "⚠️ ออฟไลน์: กำลังเปิดระบบสำรองภายในตู้...";
                statusText.style.color = "#ffb300";
                progressBar.style.width = "90%";

                // Smooth redirect to local offline bundle
                setTimeout(() => {
                    window.location.href = LOCAL_FALLBACK;
                }, 800);
            }
        }

        // Start bootloader on page load
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(checkConnectionAndBoot, 800);
        });
    </script>
</body>
</html>
