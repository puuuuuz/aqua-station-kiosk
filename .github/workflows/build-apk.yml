name: Build Android APK (Kiosk)

on:
  push:
    branches: [ main, master, dev-light-control ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Persistent Debug Keystore Bootstrapper
        run: |
          if [ -f "android/app/debug.keystore" ]; then
            echo "✅ Persistent keystore already exists."
          else
            echo "🔑 Generating persistent debug keystore..."
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            
            echo "📤 Committing persistent keystore back to repository..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/debug.keystore
            git commit -m "chore: bootstrap persistent debug keystore [skip ci]" || true
            git push || true
          fi

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install npm dependencies
        run: npm install

      - name: 📁 Prepare www assets
        run: |
          mkdir -p www
          # ⚠️⚠️⚠️ CRITICAL: BUILD SOURCE IS station-v122.html ⚠️⚠️⚠️
          # ห้ามแก้ไขโค้ดใน station-v121.html แล้วคิดว่าตู้จะได้รับการอัปเดต!
          # ไฟล์ที่แอปใช้จริงคือ station-v122.html เท่านั้น
          # station-v121.html เป็นไฟล์เก่า/backup ไม่ได้ถูก Build เข้า APK
          # Root cause ของ White Screen หลายสิบ Version ในปี 2026 มาจากการแก้ผิดไฟล์นี้
          cp station-v122.html www/index.html
          cp station-v122.html www/station-v122.html
          cp admin.html www/admin.html
          cp comprehensive-guide.html www/comprehensive-guide.html 2>/dev/null || true
          cp ad1.jpg www/ad1.jpg 2>/dev/null || true
          cp ad2.jpg www/ad2.jpg 2>/dev/null || true
          cp filters.png www/filters.png 2>/dev/null || true
          cp machine.png www/machine.png 2>/dev/null || true
          cp -r assets www/ || true

      - name: 📱 Install Android SDK
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
          mkdir -p $HOME/android-sdk/cmdline-tools
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools-extracted
          mv /tmp/cmdtools-extracted/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: 📋 Write local.properties
        run: echo "sdk.dir=$HOME/android-sdk" > android/local.properties

      - name: 🔢 Dynamic Auto-Bump Version (CI-Driven)
        run: |
          BASELINE_VERSION=$(grep "versionName" android/app/build.gradle | awk -F'"' '{print $2}' | cut -d'-' -f1)
          if [ -z "$BASELINE_VERSION" ]; then
            BASELINE_VERSION="2.0.0"
          fi
          NEW_VERSION="2.0.38"
          NEW_CODE=$(( 140 + ${{ github.run_number }} ))
          echo "🛠️ Auto-bumping Android Version to: ${NEW_VERSION} (Code: ${NEW_CODE})"
          sed -i "s/versionCode [0-9]*/versionCode ${NEW_CODE}/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"${NEW_VERSION}\"/" android/app/build.gradle

      - name: 🔄 Capacitor Sync (generates cordova.variables.gradle)
        run: npx cap sync android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: 🔧 Make Gradle executable
        run: chmod +x android/gradlew

      - name: 🏗️ Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: 🔍 Find APK
        run: find android/app/build/outputs -name "*.apk" -type f

      - name: 🏷️ Get Version Name
        id: get_version
        run: |
          VERSION_NAME=$(grep "versionName" android/app/build.gradle | awk -F'"' '{print $2}')
          echo "VERSION=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: 📤 Upload Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: aqua-station-kiosk-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: 🗜️ Zip www folder for OTA
        run: cd www && zip -r ../www.zip ./*
      
      - name: 🚀 Create GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            www.zip
          body: "Build v${{ steps.get_version.outputs.VERSION }}"
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

