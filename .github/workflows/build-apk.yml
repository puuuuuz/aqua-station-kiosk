name: Build Android APK (Kiosk)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install npm dependencies
        run: npm install

      - name: 🔄 Prepare www assets
        run: |
          mkdir -p www
          cp tablet-sync-670.html www/index.html
          cp tablet-sync-670.html www/tablet-sync-670.html
          cp admin.html www/admin.html
          cp machine.png www/machine.png 2>/dev/null || true
          cp filters.png www/filters.png 2>/dev/null || true

      - name: 📱 Install Android SDK
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
          mkdir -p $HOME/android-sdk/cmdline-tools
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools-extracted
          mv /tmp/cmdtools-extracted/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: 📋 Write local.properties
        run: echo "sdk.dir=$HOME/android-sdk" > android/local.properties

      - name: 🔄 Capacitor Sync (generates cordova.variables.gradle)
        run: npx cap sync android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: 🔧 Make Gradle executable
        run: chmod +x android/gradlew

      - name: 🏗️ Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: 🔍 Find APK
        run: find android/app/build/outputs -name "*.apk" -type f

      - name: 🏷️ Get Version Name
        id: get_version
        run: |
          VERSION_NAME=$(grep "versionName" android/app/build.gradle | awk -F'"' '{print $2}')
          echo "VERSION=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: 📤 Upload Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: aqua-station-kiosk-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: 🚀 Create GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: android/app/build/outputs/apk/debug/app-debug.apk
          body: "Build v${{ steps.get_version.outputs.VERSION }}"
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ☁️ Update Firebase OTA
        if: success()
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "❌ FIREBASE_SERVICE_ACCOUNT is not set. Skipping Firebase update."
            exit 1
          fi
          npm install firebase-admin
          echo "$FIREBASE_SERVICE_ACCOUNT" > service-account.json
          node scripts/update-ota.js "${{ steps.get_version.outputs.VERSION }}" "https://github.com/${{ github.repository }}/releases/download/latest/app-debug.apk" "service-account.json"
